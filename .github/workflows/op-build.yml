name: Build OpenWrt for BE6500

on:
  push:
    branches: [ openwrt-23.05 ]  # 监听您仓库的 openwrt-23.05 分支
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-22.04  # 指定具体的 Ubuntu 版本，确保环境一致性    
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          repository: gsy-tt/immortalwrt  # 使用您的仓库
          ref: openwrt-23.05  # 指定 openwrt-23.05 分支
          fetch-depth: 0  # 获取完整的仓库历史，确保所有提交可用

      - name: Setup build environment
        run: |
          # 安装必要的依赖（根据 OpenWrt 官方文档）
          sudo apt-get update -y
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-dev rsync subversion swig time unzip wget xmlto flex、bison、lib32z1
            
      - name: copy .config
        run: |
          cp .config .config-bak
          
      - name: Configure feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Build configuration
        run: |
          # 使用您的设备配置文件
          # make defconfig
          # 可选：自定义配置（取消注释以下行并添加配置命令）
          # make menuconfig -d config.seed  # 使用配置种子文件
          # make kernel_menuconfig  # 配置内核选项
          cp .config-bak .config

      - name: Download dependencies
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
       
          # 使用 -j$(nproc) 并行编译，V=s 输出详细日志
          make -j$(nproc) V=s || make -j1 V=s  # 如果并行编译失败，尝试单线程编译

      - name: Collect artifacts
        id: collect
        run: |
          cd bin/targets/*/*
          FILES=$(ls *.bin *.img.gz 2>/dev/null || true)
          echo "artifact_files=$(echo $FILES | tr ' ' ',')" >> $GITHUB_ENV
          echo "artifact_count=$(echo $FILES | wc -w)" >> $GITHUB_ENV

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: env.artifact_count > 0
        with:
          name: be6500-firmware
          path: |
            bin/targets/*/*/*.bin
            bin/targets/*/*/*.img.gz
            bin/targets/*/*/packages
          retention-days: 7

      - name: Display firmware information
        run: |
          echo "固件编译完成！"
          echo "下载链接将在 Actions 页面的 Artifacts 部分显示"
          echo "预计可用文件：.bin、.img.gz 格式的固件文件"
