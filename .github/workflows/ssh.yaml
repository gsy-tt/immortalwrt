name: SSH into GitHub Actions runner

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'tmate session timeout in minutes'
        default: '600'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup tmate session  # 只有v3支持的参数，无任何无效输入
        uses: mxschmitt/action-tmate@v3
        with:
          timeout: ${{ github.event.inputs.timeout }}  # ✅ v3唯一支持的超时参数（单位分钟，不是timeout-minutes）
          limit-access-to-actor: true  # ✅ 仅你能访问，保留安全配置
          # ❌ 删掉所有v3不支持的：timeout-minutes、output-web-url、enable-ipv6（v3也没有这个参数）
          # 核心：用v3支持的command打印Web地址，此时TMATE_WEB_URL一定存在
          command: |
            echo "======================= 连接信息 ======================="
            echo "✅ Web连接地址（复制到浏览器）：$TMATE_WEB_URL"
            echo "✅ SSH连接命令：ssh $TMATE_SSH_HOST"
            echo "======================================================="
