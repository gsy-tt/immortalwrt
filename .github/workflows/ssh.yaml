name: SSH into GitHub Actions runner

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'tmate session timeout in minutes'
        default: '600'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup tmate session（用v2版本，功能完整）
        uses: mxschmitt/action-tmate@v2  # 关键：降级到v2，不是v3！
        with:
          timeout-minutes: ${{ github.event.inputs.timeout }}  # v2明确支持的超时参数
          limit-access-to-actor: true  # 保留你的安全配置，仅你能访问
          command: |  # v2明确支持的command参数，能打印Web地址
            echo "======================= 连接信息 ======================="
            echo "✅ Web连接地址（复制到浏览器）：$TMATE_WEB_URL"  # 这行绝对有值
            echo "✅ SSH连接命令：ssh $TMATE_SSH_HOST"
            echo "======================================================="
